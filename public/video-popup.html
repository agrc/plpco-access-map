<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #video {
        flex: 1;
        min-height: 200px;
      }

      #player {
        display: block;
        height: 100%;
        width: 100%;
      }

      #controls {
        flex: none;
      }
    </style>
  </head>
  <body class="video">
    <div id="video"><div id="player"></div></div>
    <div id="controls"></div>
  </body>
</html>
